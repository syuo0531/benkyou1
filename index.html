<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ハンターズギルド Study RPG v6.4</title>
<style>body{margin:0;background:#100d0b;color:#eee1c8;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;display:grid;place-items:center;min-height:100vh}#loading{padding:24px;text-align:center;font-weight:800}</style>
</head>
<body>
<div id="loading">ハンターズギルド v6.4 を起動中…</div>
<script>
(async()=>{
  try{
    const urls=Array.from({length:9},(_,i)=>`chunks/part${String(i).padStart(2,'0')}.txt?v=64-run3`);
    const parts=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('load '+u);return r.text()})));
    const html=parts.join('');
    const parsed=new DOMParser().parseFromString(html,'text/html');
    const appScripts=[...parsed.querySelectorAll('script')].map(s=>s.textContent||'');
    if(!appScripts.length) throw new Error('app script not found');

    // Replace the loader shell with the app DOM, but do not rely on document.write/eval.
    document.head.innerHTML='';
    [...parsed.head.childNodes].forEach(node=>{
      if(node.nodeName.toLowerCase()!=='script') document.head.appendChild(document.importNode(node,true));
    });
    document.body.innerHTML='';
    [...parsed.body.childNodes].forEach(node=>{
      if(node.nodeName.toLowerCase()!=='script') document.body.appendChild(document.importNode(node,true));
    });

    // Execute the app as real script elements so Safari/WKWebView can run it normally.
    for(const code of appScripts){
      const s=document.createElement('script');
      s.textContent=code;
      document.body.appendChild(s);
    }
  }catch(e){
    console.error(e);
    document.body.innerHTML='<div style="padding:24px;max-width:520px;margin:auto"><h2>起動エラー</h2><p>アプリの起動に失敗しました。</p><pre style="white-space:pre-wrap;font-size:11px">'+String(e&&e.stack||e)+'</pre></div>';
  }
})();
</script>
</body>
</html>
