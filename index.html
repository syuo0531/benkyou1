<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ハンターズギルド Study RPG v3</title>
<style>
:root{--bg:#100d0b;--panel:#1c1713;--panel2:#251d17;--iron:#443a31;--iron2:#665646;--bone:#eee1c8;--muted:#a99b86;--gold:#d2a842;--ember:#c6532d;--ember2:#ef7842;--blood:#92201e;--green:#486648;--blue:#526d7f;--purple:#675073;--shadow:rgba(0,0,0,.55)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--bone);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:radial-gradient(circle at 50% -10%,#34261b 0,#17120f 38%,#0c0a08 100%);min-height:100vh;padding:16px 12px 92px}.app{max-width:520px;margin:0 auto}.hidden{display:none!important}button,input,select{font:inherit}.brand{text-align:center;padding:4px 0 12px}.brand h1{font-size:22px;margin:0;color:var(--ember2);letter-spacing:.04em}.brand p{font-size:11px;color:var(--muted);margin:4px 0 0}.ornament{height:6px;margin:0 auto 14px;max-width:180px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--iron);border-radius:8px;box-shadow:0 10px 24px var(--shadow),inset 0 0 0 1px rgba(255,255,255,.025)}.section{margin:18px 0}.section-title{display:flex;align-items:center;gap:8px;margin:0 2px 9px;font-weight:900;font-size:13px;letter-spacing:.05em}.section-title:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--iron2),transparent)}.muted{color:var(--muted)}.gold{color:var(--gold)}
.status{padding:15px}.status-top{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center}.rank-badge{width:58px;height:58px;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold),#8d6020);color:#1a1209;font-weight:1000;clip-path:polygon(50% 0,95% 25%,95% 75%,50% 100%,5% 75%,5% 25%)}.rank-name{font-weight:900;color:var(--ember2);font-size:15px}.rank-sub{font-size:11px;color:var(--muted);margin-top:3px}.stat-side{text-align:right;font-size:10px;color:var(--muted)}.stat-side b{font-size:20px;color:var(--bone);display:block}.bar{height:13px;border:1px solid var(--iron2);background:#0b0908;margin-top:12px;overflow:hidden;border-radius:2px}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),#7da76d);transition:width .35s}.bar-line{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:5px}.quick-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.quick-stat{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06);padding:8px;text-align:center;border-radius:4px}.quick-stat b{display:block;font-size:15px;color:var(--gold)}.quick-stat span{font-size:9px;color:var(--muted)}
.goal-card{padding:13px}.goal-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.goal-title{font-weight:900}.goal-note{font-size:10px;color:var(--muted)}.streak{font-size:22px;font-weight:1000;color:var(--ember2)}.weekbar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}.daydot{height:42px;border:1px solid var(--iron);border-radius:4px;display:grid;place-items:center;font-size:9px;color:var(--muted);background:#15110f}.daydot.done{background:#352118;border-color:#855330;color:#f3d8b3}.daydot.today{outline:1px solid var(--gold)}
.daily-grid{display:grid;gap:8px}.daily{padding:11px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-left:3px solid var(--gold)}.daily.done{opacity:.55;border-left-color:var(--green)}.daily-title{font-weight:800;font-size:13px}.daily-meta{font-size:10px;color:var(--muted);margin-top:3px}.btn{border:1px solid var(--iron2);background:#211a15;color:var(--bone);border-radius:4px;min-height:42px;padding:8px 12px;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(#c85a32,#7e2b1b);border-color:#df784c;color:white}.btn.green{background:linear-gradient(#667d53,#3e5138);border-color:#738960;color:#fff}.btn.gold{background:linear-gradient(#d0aa50,#8c6427);border-color:#e0c16b;color:#1c1208}.btn.ghost{background:transparent}.btn.danger{border-color:#8e3b36;color:#e08d83;background:#241211}.btn:disabled{opacity:.4;cursor:not-allowed}.icon-btn{width:42px;height:42px;padding:0;display:grid;place-items:center}
.boss{padding:14px;position:relative;overflow:hidden}.boss:before{content:"";position:absolute;inset:auto -40px -70px auto;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(198,83,45,.18),transparent 65%)}.boss-head{display:flex;gap:12px;align-items:center}.boss-icon{width:58px;height:58px;display:grid;place-items:center;clip-path:polygon(50% 0,94% 23%,94% 77%,50% 100%,6% 77%,6% 23%);font-size:27px;background:#5a2b20}.boss-name{font-size:16px;font-weight:1000}.tier{display:inline-block;margin-top:4px;padding:2px 7px;border:1px solid rgba(230,118,63,.45);color:var(--ember2);font-size:9px;border-radius:3px}.hpbar{height:18px;background:#0a0807;border:1px solid #75342e;margin-top:12px;border-radius:2px;overflow:hidden}.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#741a1a,#d24036);transition:width .3s}.boss-bottom{display:flex;justify-content:space-between;gap:10px;margin-top:7px;font-size:10px;color:var(--muted)}.boss-actions{display:flex;gap:7px;margin-top:10px}.boss-actions .btn{flex:1}.queue{display:grid;gap:6px;margin-top:8px}.queue-row{padding:9px 10px;display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;background:rgba(255,255,255,.025);border:1px solid var(--iron);border-radius:4px;font-size:11px}
.quest-list{display:grid;gap:8px}.quest{background:var(--bone);color:#2a2119;border-radius:6px;padding:12px;border-left:4px solid var(--green);box-shadow:0 5px 12px rgba(0,0,0,.28)}.quest.hard{border-left-color:var(--ember)}.quest.epic{border-left-color:var(--blood)}.quest-top{display:flex;gap:8px;justify-content:space-between}.quest-name{font-weight:900;font-size:13px;min-width:0}.tag{font-size:9px;background:rgba(0,0,0,.08);padding:3px 6px;border-radius:3px;white-space:nowrap}.quest-meta{font-size:10px;color:#625545;margin-top:4px}.quest-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:9px}.quest .btn{min-height:36px;padding:5px 9px;font-size:10px;border-color:#9b8a73;color:#463a2d}.quest .btn.primary{color:white;border-color:#a84c30}.addbox{padding:12px}.field{margin:0 0 10px}.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;border:1px solid var(--iron2);background:#0f0c0a;color:var(--bone);border-radius:4px;min-height:44px;padding:8px 10px;font-size:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.chip{min-height:43px;padding:4px;border:1px solid var(--iron2);background:#17120f;color:var(--muted);border-radius:4px;font-size:10px;font-weight:800}.chip.active{background:#592116;border-color:var(--ember2);color:white}
.review-list{display:grid;gap:7px}.review-row{padding:10px 11px;display:grid;grid-template-columns:1fr auto;gap:8px;border:1px solid var(--iron);border-radius:5px;background:rgba(255,255,255,.025)}.review-row b{font-size:12px}.review-row small{display:block;color:var(--muted);margin-top:3px}
/* equipment */
.hunter-stage{padding:0;overflow:hidden;position:relative}.hunter-scene{min-height:330px;position:relative;background:radial-gradient(circle at 50% 20%,rgba(216,142,67,.22),transparent 26%),linear-gradient(180deg,#2a2018,#100d0b 65%);overflow:hidden}.moon{position:absolute;width:92px;height:92px;border-radius:50%;background:#d9bb80;opacity:.11;top:24px;left:50%;transform:translateX(-50%)}.mountains{position:absolute;bottom:0;left:0;right:0;height:120px;background:#0c0a08;clip-path:polygon(0 100%,0 55%,14% 18%,25% 53%,42% 6%,58% 55%,72% 27%,83% 61%,100% 30%,100% 100%)}.hunter-svg{position:absolute;width:260px;height:330px;left:50%;bottom:-3px;transform:translateX(-50%);filter:drop-shadow(0 12px 14px #000)}.gear-slots{position:absolute;left:9px;top:10px;display:grid;gap:5px;z-index:3}.slot-pill{width:60px;min-height:38px;border:1px solid var(--iron2);background:rgba(10,8,7,.78);color:var(--bone);font-size:9px;border-radius:3px;padding:3px;display:grid;place-items:center;text-align:center}.slot-pill.filled{border-color:#a57a36;color:#ffe0a1}.set-banner{position:absolute;left:80px;right:10px;bottom:10px;z-index:4;background:rgba(10,8,7,.78);border:1px solid #725a36;padding:8px 10px}.set-banner b{color:#f0d394;font-size:12px}.set-banner small{display:block;color:var(--muted);margin-top:2px}.gear-summary{padding:12px}.skill-line{display:flex;justify-content:space-between;gap:8px;font-size:11px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)}.skill-line:last-child{border-bottom:0}.gear-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}.gear-tab{min-height:42px}.gear-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.gear-item{padding:9px;border:1px solid var(--iron);background:#17120f;border-radius:5px;cursor:pointer;color:var(--bone);text-align:left}.gear-item.selected{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(210,168,66,.22)}.gear-item.locked{opacity:.58}.gear-item .gicon{height:58px;display:grid;place-items:center;font-size:30px;background:linear-gradient(145deg,#392b21,#1a1511);margin-bottom:7px;border:1px solid rgba(255,255,255,.05)}.gear-item b{font-size:11px;display:block}.gear-item small{font-size:9px;color:var(--muted)}.gear-detail{padding:12px;margin-top:8px}.detail-head{display:grid;grid-template-columns:64px 1fr;gap:10px}.detail-icon{height:64px;display:grid;place-items:center;font-size:34px;background:#2d211a;border:1px solid #745c38}.detail-name{font-size:15px;font-weight:1000}.stars{color:var(--gold);letter-spacing:.04em;font-size:11px}.costs{font-size:10px;color:var(--muted);margin:7px 0}.skills{font-size:10px;color:#d7c6a8}.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.detail-actions .primary{grid-column:1/-1}
.bestiary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.monster{padding:10px 6px;text-align:center}.monster .micon{font-size:32px}.monster b{font-size:10px;display:block;margin-top:4px}.monster small{font-size:9px;color:var(--gold)}.materials{display:flex;flex-wrap:wrap;gap:6px}.mat{border:1px solid var(--iron);padding:6px 9px;border-radius:20px;font-size:10px;background:rgba(255,255,255,.03)}.mat b{color:var(--gold)}
.record-card{padding:12px}.big-number{font-size:28px;font-weight:1000;color:var(--gold)}.chart{height:140px;display:flex;align-items:flex-end;gap:7px;padding-top:10px}.chart-col{flex:1;display:grid;grid-template-rows:1fr auto;gap:4px;height:100%;text-align:center}.chart-bar{align-self:end;background:linear-gradient(var(--ember2),#672317);min-height:3px;border-radius:3px 3px 0 0}.chart-col span{font-size:9px;color:var(--muted)}.log{display:grid;gap:5px}.log-row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid rgba(255,255,255,.06);padding:7px 2px;font-size:10px}.log-row span:last-child{color:var(--gold)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(13,10,8,.96);border-top:1px solid var(--iron2);padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.nav button{border:0;background:transparent;color:#8f8372;min-height:54px;font-size:9px;font-weight:800}.nav button b{display:block;font-size:19px;line-height:20px}.nav button.active{color:#f3d29b;background:#35160f;border-radius:6px}
.modal{position:fixed;inset:0;background:rgba(5,4,3,.88);z-index:100;display:none;padding:18px 12px;overflow:auto}.modal.show{display:block}.modal-card{max-width:470px;margin:28px auto;background:linear-gradient(#281f18,#15110e);border:1px solid #7f623a;border-radius:8px;padding:14px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modal-head b{font-size:16px}.modal-head button{width:42px;height:42px}.modal-actions{display:flex;gap:7px;margin-top:12px}.modal-actions .btn{flex:1}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%) translateY(12px);background:#d06032;color:#160d08;padding:9px 14px;border-radius:5px;font-weight:900;font-size:11px;opacity:0;pointer-events:none;transition:.2s;z-index:200;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:380px){.quick-stats{grid-template-columns:1fr 1fr}.chips{grid-template-columns:1fr 1fr}.gear-grid{grid-template-columns:1fr}.status-top{grid-template-columns:52px 1fr}.stat-side{grid-column:1/-1;text-align:left}.bestiary-grid{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.quest-actions{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="brand"><h1>ハンターズギルド 依頼所</h1><p>学びを依頼に変え、積み重ねで強くなる Study RPG</p></header><div class="ornament"></div>

  <main>
    <section class="view" data-view="home">
      <div class="card status">
        <div class="status-top"><div class="rank-badge" id="rankBadge">Lv1</div><div><div class="rank-name" id="rankName">下位ハンター</div><div class="rank-sub" id="rankSub">次のレベルまで 100 XP</div></div><div class="stat-side">討伐依頼<b id="clearCount">0</b></div></div>
        <div class="bar"><i id="xpBar"></i></div><div class="bar-line"><span id="xpNow">0 XP</span><span id="xpNeed">100 XP</span></div>
        <div class="quick-stats"><div class="quick-stat"><b id="todayMinutes">0分</b><span>今日の勉強</span></div><div class="quick-stat"><b id="weekMinutes">0分</b><span>今週</span></div><div class="quick-stat"><b id="streakMini">0日</b><span>連続学習</span></div></div>
      </div>

      <div class="section"><div class="section-title">今日の狩猟記録</div><div class="card goal-card"><div class="goal-row"><div><div class="goal-title">連続学習ストリーク</div><div class="goal-note" id="streakNote">今日1つ達成すると継続</div></div><div class="streak" id="streakBig">🔥 0</div></div><div class="weekbar" id="weekDots"></div></div></div>

      <div class="section"><div class="section-title">デイリークエスト</div><div class="daily-grid" id="dailyGrid"></div></div>

      <div class="section"><div class="section-title">討伐対象</div><div id="bossArea"></div></div>

      <div class="section"><div class="section-title">次の復習</div><div class="review-list" id="homeReview"></div></div>
    </section>

    <section class="view hidden" data-view="quests">
      <div class="section"><div class="section-title">受注中のクエスト</div><div class="quest-list" id="questList"></div></div>
      <div class="section"><div class="section-title">新しいクエスト</div><div class="card addbox">
        <div class="field"><label>内容</label><input id="questName" maxlength="70" placeholder="例：解剖学 問題を30問解く"></div>
        <div class="grid2"><div class="field"><label>予定勉強時間（分）</label><input id="questMinutes" type="number" min="1" max="600" value="30"></div><div class="field"><label>難易度</label><select id="questDiff"><option value="easy">易 10XP</option><option value="normal" selected>普通 25XP</option><option value="hard">難 50XP</option><option value="epic">大型 100XP</option></select></div></div>
        <button class="btn primary" id="addQuest" style="width:100%">依頼を貼り出す</button>
      </div></div>
      <div class="section"><div class="section-title">討伐対象を追加</div><div class="card addbox">
        <div class="field"><label>モンスター名 / 試験名</label><input id="bossName" maxlength="50" placeholder="例：AT模試・外科"></div>
        <div class="grid2"><div class="field"><label>最大HP（自由設定）</label><input id="bossHp" type="number" min="50" max="99999" value="1000"></div><div class="field"><label>脅威度</label><select id="bossTier"><option value="small">小型</option><option value="medium">中型</option><option value="large" selected>大型</option><option value="ancient">古龍級</option></select></div></div>
        <div class="field"><label>制限時間（時間・空欄で無期限）</label><input id="bossDeadline" type="number" min="1" max="9999" placeholder="例：72"></div>
        <button class="btn danger" id="addBoss" style="width:100%">討伐依頼を張り出す</button>
      </div></div>
      <div class="section"><div class="section-title">復習スケジュール</div><div class="review-list" id="reviewList"></div></div>
    </section>

    <section class="view hidden" data-view="gear">
      <div class="section"><div class="section-title">装備工房</div><div class="card hunter-stage"><div class="hunter-scene"><div class="moon"></div><div class="mountains"></div><div class="gear-slots" id="gearSlots"></div>
        <svg class="hunter-svg" viewBox="0 0 260 340" aria-label="装備中のハンター">
          <defs><linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d6b496"/><stop offset="1" stop-color="#9d795f"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f8981"/><stop offset=".45" stop-color="#393430"/><stop offset="1" stop-color="#171411"/></linearGradient><linearGradient id="blade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1c266"/><stop offset=".35" stop-color="#b93d28"/><stop offset="1" stop-color="#2b1510"/></linearGradient></defs>
          <g id="visWeapon" opacity=".15"><path d="M182 18 L208 34 L125 255 L103 241 Z" fill="url(#blade)"/><path d="M165 27 L200 47" stroke="#ddc78d" stroke-width="6"/><path d="M108 239 L137 252" stroke="#241c16" stroke-width="12" stroke-linecap="round"/></g>
          <path id="visCape" d="M82 117 Q130 90 174 119 L199 300 Q139 327 66 294 Z" fill="#421b17" opacity=".25"/>
          <circle cx="128" cy="66" r="31" fill="url(#skin)"/><path d="M97 66 Q102 28 130 27 Q161 30 159 75 Q146 53 131 45 Q112 58 97 66Z" fill="#17130f"/>
          <path d="M101 98 Q128 79 156 98 L167 132 L94 132 Z" fill="#2b2723"/>
          <path id="visChest" d="M93 120 L111 102 L128 114 L146 102 L167 121 L158 194 L99 194 Z" fill="url(#metal)" stroke="#9d7c45" stroke-width="2" opacity=".25"/>
          <path id="visHead" d="M100 65 Q103 31 128 25 Q154 31 159 65 L151 52 L142 39 L128 48 L114 39 L105 53 Z" fill="url(#metal)" stroke="#9d7c45" stroke-width="2" opacity=".12"/>
          <path id="visArmL" d="M94 120 L65 131 L68 178 L99 165 Z" fill="url(#metal)" stroke="#9d7c45" stroke-width="2" opacity=".18"/><path id="visArmR" d="M166 120 L194 132 L188 178 L158 164 Z" fill="url(#metal)" stroke="#9d7c45" stroke-width="2" opacity=".18"/>
          <path id="visWaist" d="M98 190 L159 190 L171 225 L153 238 L128 225 L103 238 L87 224 Z" fill="#50301f" stroke="#9d7c45" stroke-width="2" opacity=".18"/>
          <path id="visLegL" d="M105 226 L126 226 L122 306 L96 306 Z" fill="url(#metal)" opacity=".2"/><path id="visLegR" d="M133 226 L154 226 L164 306 L137 306 Z" fill="url(#metal)" opacity=".2"/>
          <path d="M96 305 L123 305 L120 329 L86 329 Z" fill="#171411"/><path d="M137 305 L164 305 L175 329 L140 329 Z" fill="#171411"/>
          <circle id="visCharm" cx="128" cy="147" r="7" fill="#d6ad45" opacity=".15"/><path d="M128 154 L134 168 L128 176 L122 168 Z" fill="#d6ad45" opacity=".15" id="visCharmDrop"/>
        </svg><div class="set-banner"><b id="setName">旅立ちの装い</b><small id="setBonus">セット効果なし</small></div></div><div class="gear-summary" id="gearSkills"></div></div></div>
      <div class="section"><div class="section-title">装備一覧</div><div class="gear-tabs" id="gearTabs"></div><div class="gear-grid" id="gearGrid"></div><div class="card gear-detail" id="gearDetail"></div></div>
      <div class="section"><div class="section-title">所持素材</div><div class="materials" id="materials"></div></div>
    </section>

    <section class="view hidden" data-view="bestiary">
      <div class="section"><div class="section-title">モンスター図鑑</div><div class="bestiary-grid" id="bestiaryGrid"></div></div>
      <div class="section"><div class="section-title">称号</div><div id="achievementList" class="review-list"></div></div>
    </section>

    <section class="view hidden" data-view="records">
      <div class="section"><div class="section-title">学習記録</div><div class="card record-card"><div class="muted" style="font-size:10px">累計勉強時間</div><div class="big-number" id="totalStudy">0時間</div><div class="chart" id="studyChart"></div></div></div>
      <div class="section"><div class="section-title">手動で勉強時間を追加</div><div class="card addbox"><div class="grid2"><div class="field"><label>内容</label><input id="manualStudyName" placeholder="例：AT模試復習"></div><div class="field"><label>時間（分）</label><input id="manualStudyMinutes" type="number" min="1" max="600" value="30"></div></div><button class="btn green" id="addStudy" style="width:100%">学習記録に追加</button></div></div>
      <div class="section"><div class="section-title">最近のログ</div><div class="log" id="logList"></div></div>
    </section>
  </main>
</div>

<script>
(()=>{
const STORAGE_KEY='quest-study-state-v3', OLD_KEY='quest-study-state';
const DAY=86400000;
const DIFF={easy:{label:'易',xp:10},normal:{label:'普通',xp:25},hard:{label:'難',xp:50},epic:{label:'大型',xp:100}};
const TIERS={small:{label:'小型',icon:'🐾',color:'#47634a'},medium:{label:'中型',icon:'🐺',color:'#9b4b2d'},large:{label:'大型',icon:'☠',color:'#8e2924'},ancient:{label:'古龍級',icon:'🐉',color:'#a17a2e'}};
const MATS={small_fang:'小型の牙',medium_pelt:'中型の毛皮',large_horn:'大型の角',ancient_scale:'古龍の鱗',shiny_ore:'光る鉱石'};
const REVIEW_DAYS=[1,3,7,14,30];
const RANKS=[{n:1,t:'下位ハンター'},{n:3,t:'中位ハンター'},{n:6,t:'上位ハンター'},{n:10,t:'熟練ハンター'},{n:15,t:'討伐者'},{n:20,t:'伝説の狩人'}];
const GEAR=[
{id:'wep_small',name:'骨の小刀',slot:'weapon',icon:'🗡️',rarity:1,set:'bone',cost:{small_fang:3},skills:{xp:0.02}},
{id:'wep_medium',name:'牙の大剣',slot:'weapon',icon:'⚔️',rarity:2,set:'wolf',cost:{medium_pelt:4},skills:{hardXp:0.08}},
{id:'wep_large',name:'角の戦槌',slot:'weapon',icon:'🔨',rarity:3,set:'horn',cost:{large_horn:4},skills:{xp:0.06}},
{id:'wep_ancient',name:'竜鱗の大剣',slot:'weapon',icon:'🗡️',rarity:5,set:'dragon',cost:{ancient_scale:4},skills:{xp:0.1,hardXp:0.1}},
{id:'head_wolf',name:'黒狼の兜',slot:'head',icon:'🪖',rarity:2,set:'wolf',cost:{medium_pelt:3},skills:{xp:0.02}},
{id:'chest_wolf',name:'黒狼の鎧',slot:'chest',icon:'🛡️',rarity:2,set:'wolf',cost:{medium_pelt:5},skills:{material:0.08}},
{id:'arms_wolf',name:'黒狼の篭手',slot:'arms',icon:'🥊',rarity:2,set:'wolf',cost:{medium_pelt:3},skills:{hardXp:0.05}},
{id:'waist_wolf',name:'黒狼の腰鎧',slot:'waist',icon:'🧷',rarity:2,set:'wolf',cost:{medium_pelt:3},skills:{xp:0.02}},
{id:'legs_wolf',name:'黒狼の脚甲',slot:'legs',icon:'🥾',rarity:2,set:'wolf',cost:{medium_pelt:4},skills:{material:0.05}},
{id:'head_dragon',name:'古龍の角冠',slot:'head',icon:'👑',rarity:5,set:'dragon',cost:{ancient_scale:3,shiny_ore:1},skills:{xp:0.05}},
{id:'chest_dragon',name:'古龍の胸鎧',slot:'chest',icon:'🛡️',rarity:5,set:'dragon',cost:{ancient_scale:6},skills:{xp:0.05}},
{id:'arms_dragon',name:'古龍の篭手',slot:'arms',icon:'🥊',rarity:5,set:'dragon',cost:{ancient_scale:4},skills:{hardXp:0.08}},
{id:'waist_dragon',name:'古龍の腰鎧',slot:'waist',icon:'🧷',rarity:5,set:'dragon',cost:{ancient_scale:4},skills:{material:0.1}},
{id:'legs_dragon',name:'古龍の脚甲',slot:'legs',icon:'🥾',rarity:5,set:'dragon',cost:{ancient_scale:5},skills:{xp:0.05}},
{id:'charm_focus',name:'集中の護石',slot:'charm',icon:'💎',rarity:3,set:'none',cost:{shiny_ore:2,large_horn:2},skills:{xp:0.05}},
{id:'charm_rare',name:'輝石のお守り',slot:'charm',icon:'🔮',rarity:5,set:'none',cost:{shiny_ore:3},skills:{material:0.15}}
];
const SLOTS=[['weapon','武器'],['head','頭'],['chest','胴'],['arms','腕'],['waist','腰'],['legs','脚'],['charm','お守り']];
const ACH=[
{id:'first',title:'駆け出しハンター',desc:'初めてクエストを達成',ok:s=>s.totalDone>=1},
{id:'ten',title:'働き者',desc:'クエスト10回達成',ok:s=>s.totalDone>=10},
{id:'fifty',title:'ギルドの常連',desc:'クエスト50回達成',ok:s=>s.totalDone>=50},
{id:'firstboss',title:'一人前の狩人',desc:'初めてボス討伐',ok:s=>s.bestiary.length>=1},
{id:'ancient',title:'龍殺し',desc:'古龍級を討伐',ok:s=>s.bestiary.some(x=>x.tierKey==='ancient')},
{id:'streak7',title:'七日連戦',desc:'7日連続で学習',ok:s=>s.streak.current>=7},
{id:'streak30',title:'不屈の学究者',desc:'30日連続で学習',ok:s=>s.streak.current>=30},
{id:'study50',title:'五十時間の証',desc:'累計50時間学習',ok:s=>totalMinutes(s)>=3000},
{id:'fullwolf',title:'黒狼を纏う者',desc:'黒狼防具5部位を作成',ok:s=>['head_wolf','chest_wolf','arms_wolf','waist_wolf','legs_wolf'].every(id=>s.craftedGear.includes(id))}
];
let state=blankState(), gearSlot='weapon', selectedGear=null;
function blankState(){return {xp:0,level:1,quests:[],log:[],totalDone:0,bosses:[],activeBossId:null,bestiary:[],achievements:[],reviewQueue:[],inventory:{},craftedGear:[],equipped:{weapon:null,head:null,chest:null,arms:null,waist:null,legs:null,charm:null},studyByDate:{},daily:{date:'',items:[]},streak:{current:0,best:0,lastDate:null},settings:{weeklyGoal:600}}}
function dateKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function addDaysKey(base,days){const [y,m,d]=base.split('-').map(Number);const x=new Date(y,m-1,d+days);return dateKey(x)}
function parseDateKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function totalMinutes(s=state){return Object.values(s.studyByDate||{}).reduce((a,b)=>a+(Number(b)||0),0)}
function weekKeys(){const now=new Date(), day=(now.getDay()+6)%7, mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-day);return Array.from({length:7},(_,i)=>dateKey(new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i)))}
function weekMinutes(){return weekKeys().reduce((n,k)=>n+(state.studyByDate[k]||0),0)}
function rankName(){let t=RANKS[0].t;for(const r of RANKS)if(state.level>=r.n)t=r.t;return t}
function xpNeed(){return state.level*100}
function gearById(id){return GEAR.find(g=>g.id===id)}
function escapeHtml(v){const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML}
async function storageGet(key){try{if(window.storage?.get){const r=await window.storage.get(key,false);return r?.value||null}}catch(e){}try{return localStorage.getItem(key)}catch(e){return null}}
async function storageSet(key,val){try{if(window.storage?.set){await window.storage.set(key,val,false);return}}catch(e){}try{localStorage.setItem(key,val)}catch(e){}}
async function load(){let raw=await storageGet(STORAGE_KEY), old=false;if(!raw){raw=await storageGet(OLD_KEY);old=!!raw}if(raw){try{state=migrate(JSON.parse(raw))}catch(e){state=blankState()}}ensureDaily();checkReviews();checkDeadlines();checkAchievements();render();await save();if(old)toast('以前のセーブデータをv3へ移行しました')}
function migrate(s){const b=Object.assign(blankState(),s||{});b.studyByDate=b.studyByDate||{};b.streak=Object.assign({current:0,best:0,lastDate:null},b.streak||{});b.daily=b.daily||{date:'',items:[]};b.reviewQueue=b.reviewQueue||b.respawnQueue||[];b.inventory=b.inventory||{};b.craftedGear=b.craftedGear||[];b.equipped=Object.assign(blankState().equipped,b.equipped||{});if(b.equipped.armor&&!b.equipped.chest)b.equipped.chest=b.equipped.armor;b.equipped.armor=undefined;
  // map old armor items into new chest equivalents without deleting ownership
  if(b.craftedGear.includes('arm_medium')&&!b.craftedGear.includes('chest_wolf'))b.craftedGear.push('chest_wolf');
  if(b.craftedGear.includes('arm_ancient')&&!b.craftedGear.includes('chest_dragon'))b.craftedGear.push('chest_dragon');
  if(b.equipped.chest==='arm_medium')b.equipped.chest='chest_wolf';if(b.equipped.chest==='arm_ancient')b.equipped.chest='chest_dragon';
  b.quests=(b.quests||[]).map(q=>({...q,minutes:Math.max(1,Number(q.minutes)||30)}));
  b.bosses=(b.bosses||[]).map(x=>({...x,reviewStage:Number.isInteger(x.reviewStage)?x.reviewStage:-1}));
  b.reviewQueue=(b.reviewQueue||[]).map(r=>({name:r.name||'復習対象',tierKey:r.tierKey||'small',maxHp:Math.max(50,Number(r.maxHp)||200),dueDate:r.dueDate||dateKey(new Date(r.respawnAt||Date.now())),stage:Number.isInteger(r.stage)?r.stage:0}));
  return b}
async function save(){await storageSet(STORAGE_KEY,JSON.stringify(state))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800)}
function ensureDaily(){const today=dateKey();if(state.daily.date===today&&state.daily.items?.length)return;state.daily={date:today,items:[{id:'focus',name:'集中して25分勉強する',xp:20,minutes:25,done:false},{id:'questions',name:'問題を30問解く',xp:25,minutes:30,done:false},{id:'review',name:'昨日までの内容を復習する',xp:30,minutes:20,done:false}]}}
function touchStudyDay(minutes,name='学習'){const n=Math.max(0,Math.round(Number(minutes)||0));if(n<=0)return;const k=dateKey();state.studyByDate[k]=(state.studyByDate[k]||0)+n;updateStreak(k);state.log.push({name,minutes:n,xp:0,date:Date.now(),type:'study'})}
function updateStreak(k){const last=state.streak.lastDate;if(last===k)return;if(!last){state.streak.current=1}else{const next=addDaysKey(last,1);state.streak.current=next===k?state.streak.current+1:1}state.streak.lastDate=k;state.streak.best=Math.max(state.streak.best,state.streak.current)}
function gearEffects(){let xp=0,hardXp=0,material=0;const setCount={wolf:0,dragon:0};for(const [slot] of SLOTS){const g=gearById(state.equipped[slot]);if(!g)continue;xp+=g.skills.xp||0;hardXp+=g.skills.hardXp||0;material+=g.skills.material||0;if(setCount[g.set]!=null)setCount[g.set]++}if(setCount.wolf>=3)xp+=.05;if(setCount.wolf>=5)material+=.12;if(setCount.dragon>=3)xp+=.10;if(setCount.dragon>=5){xp+=.10;hardXp+=.15}return{xp,hardXp,material,setCount}}
function rewardXp(base,diff='normal'){const e=gearEffects();return Math.max(1,Math.round(base*(1+e.xp+(diff==='hard'||diff==='epic'?e.hardXp:0))))}
function grantXp(amount){let a=Math.max(0,Math.round(amount));state.xp+=a;let up=false;while(state.xp>=xpNeed()){state.xp-=xpNeed();state.level++;up=true}return up}
function completeLearning(name,baseXp,minutes,diff='normal'){const gain=rewardXp(baseXp,diff);state.totalDone++;touchStudyDay(minutes,name);state.log.push({name,xp:gain,minutes,date:Date.now(),type:'quest'});const boss=getActiveBoss();let defeated=null;if(boss){boss.hp-=gain;if(boss.hp<=0){boss.hp=0;defeated=boss}}const up=grantXp(gain);return{gain,boss,defeated,up}}
function getActiveBoss(){let b=state.bosses.find(x=>x.id===state.activeBossId);if(!b&&state.bosses.length){b=state.bosses[0];state.activeBossId=b.id}return b}
function dropMaterials(boss){const map={small:'small_fang',medium:'medium_pelt',large:'large_horn',ancient:'ancient_scale'},key=map[boss.tierKey]||'small_fang';const eff=gearEffects();let n=1+Math.floor(Math.random()*3);if(Math.random()<eff.material)n++;state.inventory[key]=(state.inventory[key]||0)+n;let text=`${MATS[key]} ×${n}`;if(Math.random()<.15+eff.material*.35){state.inventory.shiny_ore=(state.inventory.shiny_ore||0)+1;text+=`、${MATS.shiny_ore} ×1`}return text}
function defeatBoss(boss){let entry=state.bestiary.find(x=>x.name===boss.name);if(entry){entry.count++;entry.tierKey=boss.tierKey}else state.bestiary.push({name:boss.name,tierKey:boss.tierKey,count:1,firstAt:Date.now()});const drops=dropMaterials(boss);grantXp(boss.reward||Math.round(boss.maxHp*.2));state.bosses=state.bosses.filter(x=>x.id!==boss.id);if(state.activeBossId===boss.id)state.activeBossId=state.bosses[0]?.id||null;
  const nextStage=(boss.reviewStage??-1)+1;if(nextStage<REVIEW_DAYS.length){state.reviewQueue.push({name:boss.originalName||boss.name.replace(/^【復習】/,'').trim(),tierKey:boss.tierKey,maxHp:Math.max(50,Math.round(boss.maxHp*.72)),stage:nextStage,dueDate:addDaysKey(dateKey(),REVIEW_DAYS[nextStage])})}return drops}
function checkReviews(){const today=dateKey();const due=state.reviewQueue.filter(r=>r.dueDate<=today);state.reviewQueue=state.reviewQueue.filter(r=>r.dueDate>today);for(const r of due){state.bosses.push({id:'b'+Date.now()+Math.random().toString(36).slice(2,6),name:`【復習${REVIEW_DAYS[r.stage]}日】${r.name}`,originalName:r.name,maxHp:r.maxHp,hp:r.maxHp,tierKey:r.tierKey,reward:Math.round(r.maxHp*.15),deadlineAt:null,reviewStage:r.stage})}if(due.length&&!state.activeBossId)state.activeBossId=state.bosses[0]?.id||null}
function checkDeadlines(){const now=Date.now();const expired=state.bosses.filter(b=>b.deadlineAt&&b.deadlineAt<=now);if(!expired.length)return;state.bosses=state.bosses.filter(b=>!b.deadlineAt||b.deadlineAt>now);if(!state.bosses.some(b=>b.id===state.activeBossId))state.activeBossId=state.bosses[0]?.id||null}
function checkAchievements(){for(const a of ACH)if(!state.achievements.includes(a.id)&&a.ok(state))state.achievements.push(a.id)}
function canCraft(g){return Object.entries(g.cost).every(([m,n])=>(state.inventory[m]||0)>=n)}
function craft(g){if(state.craftedGear.includes(g.id)||!canCraft(g))return false;for(const [m,n] of Object.entries(g.cost))state.inventory[m]-=n;state.craftedGear.push(g.id);return true}
function render(){ensureDaily();checkReviews();checkDeadlines();checkAchievements();renderStatus();renderDaily();renderBosses();renderQuests();renderReviews();renderGear();renderBestiary();renderAchievements();renderRecords()}
function renderStatus(){document.getElementById('rankBadge').textContent='Lv'+state.level;document.getElementById('rankName').textContent=rankName();document.getElementById('rankSub').textContent=`次のレベルまで ${xpNeed()-state.xp} XP`;document.getElementById('xpNow').textContent=state.xp+' XP';document.getElementById('xpNeed').textContent=xpNeed()+' XP';document.getElementById('xpBar').style.width=Math.min(100,state.xp/xpNeed()*100)+'%';document.getElementById('clearCount').textContent=state.totalDone;document.getElementById('todayMinutes').textContent=(state.studyByDate[dateKey()]||0)+'分';document.getElementById('weekMinutes').textContent=weekMinutes()+'分';document.getElementById('streakMini').textContent=state.streak.current+'日';document.getElementById('streakBig').textContent='🔥 '+state.streak.current;document.getElementById('streakNote').textContent=state.streak.lastDate===dateKey()?`今日も継続中・最長 ${state.streak.best}日`:`今日1つ達成すると継続・最長 ${state.streak.best}日`;
 const dots=document.getElementById('weekDots');dots.innerHTML='';const names=['月','火','水','木','金','土','日'];weekKeys().forEach((k,i)=>{const d=document.createElement('div');d.className='daydot'+((state.studyByDate[k]||0)>0?' done':'')+(k===dateKey()?' today':'');d.innerHTML=`<span>${names[i]}<br>${state.studyByDate[k]||0}分</span>`;dots.appendChild(d)})}
function renderDaily(){const area=document.getElementById('dailyGrid');area.innerHTML='';state.daily.items.forEach(it=>{const d=document.createElement('div');d.className='card daily'+(it.done?' done':'');d.innerHTML=`<div><div class="daily-title">${escapeHtml(it.name)}</div><div class="daily-meta">${it.minutes}分 ・ ${it.xp}XP${it.done?' ・ 達成済み':''}</div></div><button class="btn ${it.done?'ghost':'gold'}" data-daily="${it.id}" ${it.done?'disabled':''}>${it.done?'✓':'達成'}</button>`;area.appendChild(d)})}
function renderBosses(){const area=document.getElementById('bossArea');area.innerHTML='';const active=getActiveBoss();if(!active){area.innerHTML='<div class="card addbox muted" style="text-align:center">討伐対象なし。クエスト画面から追加できます。</div>';return}const t=TIERS[active.tierKey]||TIERS.small,pct=Math.max(0,active.hp/active.maxHp*100);const c=document.createElement('div');c.className='card boss';c.innerHTML=`<div class="boss-head"><div class="boss-icon" style="background:${t.color}">${t.icon}</div><div><div class="boss-name">${escapeHtml(active.name)}</div><span class="tier">${t.label}${active.reviewStage>=0?'・復習':''}</span></div></div><div class="hpbar"><i style="width:${pct}%"></i></div><div class="boss-bottom"><span>HP ${Math.max(0,Math.round(active.hp))} / ${active.maxHp}</span><span>報酬 +${active.reward}XP</span></div><div class="boss-actions"><button class="btn ghost" data-edit-boss="${active.id}">編集</button><button class="btn danger" data-remove-boss="${active.id}">破棄</button></div>`;area.appendChild(c);const others=state.bosses.filter(b=>b.id!==active.id);if(others.length){const q=document.createElement('div');q.className='queue';others.forEach(b=>{const r=document.createElement('div');r.className='queue-row';r.innerHTML=`<span>${escapeHtml(b.name)} <span class="muted">HP ${Math.round(b.hp)}/${b.maxHp}</span></span><button class="btn" data-target="${b.id}">対象にする</button>`;q.appendChild(r)});area.appendChild(q)}}
function renderQuests(){const area=document.getElementById('questList');area.innerHTML='';if(!state.quests.length){area.innerHTML='<div class="card addbox muted" style="text-align:center">受注中の依頼はありません。</div>';return}state.quests.forEach(q=>{const info=DIFF[q.diffKey]||DIFF.normal,c=document.createElement('div');c.className='quest '+(q.diffKey==='hard'?'hard':q.diffKey==='epic'?'epic':'');c.innerHTML=`<div class="quest-top"><div class="quest-name">${escapeHtml(q.name)}</div><span class="tag">${info.label}</span></div><div class="quest-meta">予定 ${q.minutes||30}分 ・ 基本 ${q.xp}XP</div><div class="quest-actions"><button class="btn" data-edit-quest="${q.id}">編集</button><button class="btn primary" data-clear="${q.id}">達成</button></div>`;area.appendChild(c)})}
function renderReviews(){const rows=[document.getElementById('homeReview'),document.getElementById('reviewList')];for(const area of rows){area.innerHTML='';const list=[...state.reviewQueue].sort((a,b)=>a.dueDate.localeCompare(b.dueDate));if(!list.length){area.innerHTML='<div class="card addbox muted" style="text-align:center">予定されている復習はありません。</div>';continue}list.slice(0,area.id==='homeReview'?3:99).forEach(r=>{const d=document.createElement('div');d.className='review-row';d.innerHTML=`<div><b>${escapeHtml(r.name)}</b><small>${r.dueDate} ・ ${REVIEW_DAYS[r.stage]}日後復習 ・ HP ${r.maxHp}</small></div><span class="gold">${r.dueDate<=dateKey()?'出現':'待機'}</span>`;area.appendChild(d)})}}
function renderGear(){const eff=gearEffects(),slotArea=document.getElementById('gearSlots');slotArea.innerHTML='';SLOTS.forEach(([k,label])=>{const g=gearById(state.equipped[k]);const d=document.createElement('div');d.className='slot-pill'+(g?' filled':'');d.textContent=g?`${label}\n${g.name}`:label+'\n—';slotArea.appendChild(d)});document.getElementById('gearSkills').innerHTML=`<div class="skill-line"><span>装備スキル：獲得XP</span><b>+${Math.round(eff.xp*100)}%</b></div><div class="skill-line"><span>高難度ボーナス</span><b>+${Math.round(eff.hardXp*100)}%</b></div><div class="skill-line"><span>追加素材率</span><b>+${Math.round(eff.material*100)}%</b></div>`;let setText='セット効果なし',setName='旅立ちの装い';if(eff.setCount.dragon>=3){setName='古龍シリーズ';setText=eff.setCount.dragon>=5?'5部位：XP+20% / 高難度+15%':'3部位：XP+10%'}else if(eff.setCount.wolf>=3){setName='黒狼シリーズ';setText=eff.setCount.wolf>=5?'5部位：XP+5% / 素材+12%':'3部位：XP+5%'}document.getElementById('setName').textContent=setName;document.getElementById('setBonus').textContent=setText;applyVisuals();renderGearTabs();renderGearGrid();renderGearDetail();const mats=document.getElementById('materials');mats.innerHTML='';Object.keys(MATS).forEach(k=>{const d=document.createElement('div');d.className='mat';d.innerHTML=`${MATS[k]} <b>×${state.inventory[k]||0}</b>`;mats.appendChild(d)})}
function applyVisuals(){const op=(id,on)=>document.getElementById(id).style.opacity=on?'1':'.14';op('visWeapon',!!state.equipped.weapon);op('visHead',!!state.equipped.head);op('visChest',!!state.equipped.chest);op('visArmL',!!state.equipped.arms);op('visArmR',!!state.equipped.arms);op('visWaist',!!state.equipped.waist);op('visLegL',!!state.equipped.legs);op('visLegR',!!state.equipped.legs);op('visCharm',!!state.equipped.charm);op('visCharmDrop',!!state.equipped.charm);const dragon=SLOTS.some(([s])=>gearById(state.equipped[s])?.set==='dragon'),wolf=SLOTS.some(([s])=>gearById(state.equipped[s])?.set==='wolf');document.getElementById('visCape').style.fill=dragon?'#5f1717':wolf?'#253942':'#421b17';document.getElementById('visCape').style.opacity=(dragon||wolf)?'.9':'.25'}
function renderGearTabs(){const area=document.getElementById('gearTabs');area.innerHTML='';const groups=[['weapon','武器'],['head','頭'],['chest','胴'],['arms','腕'],['waist','腰'],['legs','脚'],['charm','護石']];groups.forEach(([k,l])=>{const b=document.createElement('button');b.className='btn gear-tab '+(gearSlot===k?'gold':'');b.dataset.gearTab=k;b.textContent=l;area.appendChild(b)})}
function renderGearGrid(){const area=document.getElementById('gearGrid');area.innerHTML='';const list=GEAR.filter(g=>g.slot===gearSlot);if(!selectedGear||!list.some(g=>g.id===selectedGear))selectedGear=state.equipped[gearSlot]||list[0]?.id||null;list.forEach(g=>{const made=state.craftedGear.includes(g.id),eq=state.equipped[g.slot]===g.id,b=document.createElement('button');b.type='button';b.className='gear-item '+(selectedGear===g.id?'selected ':'')+(made?'':'locked');b.dataset.gear=g.id;b.innerHTML=`<div class="gicon">${g.icon}</div><b>${escapeHtml(g.name)}</b><small>${'★'.repeat(g.rarity)}${eq?' ・ 装備中':made?' ・ 作成済み':' ・ 未作成'}</small>`;area.appendChild(b)})}
function renderGearDetail(){const area=document.getElementById('gearDetail'),g=gearById(selectedGear);if(!g){area.innerHTML='<div class="muted">装備を選択してください。</div>';return}const made=state.craftedGear.includes(g.id),eq=state.equipped[g.slot]===g.id,cost=Object.entries(g.cost).map(([m,n])=>`${MATS[m]} ${state.inventory[m]||0}/${n}`).join(' ・ '),skill=Object.entries(g.skills).map(([k,v])=>`${k==='xp'?'獲得XP':k==='hardXp'?'高難度XP':'素材率'} +${Math.round(v*100)}%`).join(' / ');area.innerHTML=`<div class="detail-head"><div class="detail-icon">${g.icon}</div><div><div class="detail-name">${escapeHtml(g.name)}</div><div class="stars">${'★'.repeat(g.rarity)}${'☆'.repeat(5-g.rarity)}</div><div class="skills">${skill||'固有スキルなし'}</div></div></div><div class="costs">必要素材：${cost}</div><div class="detail-actions"><button class="btn gold" id="craftGear" ${made||!canCraft(g)?'disabled':''}>${made?'作成済み':canCraft(g)?'作成する':'素材不足'}</button><button class="btn primary" id="equipGear" ${made?'':'disabled'}>${eq?'装備を外す':'装備する'}</button></div>`}
function renderBestiary(){const area=document.getElementById('bestiaryGrid');area.innerHTML='';if(!state.bestiary.length){area.innerHTML='<div class="card addbox muted" style="grid-column:1/-1;text-align:center">まだ討伐記録はありません。</div>';return}state.bestiary.forEach(m=>{const t=TIERS[m.tierKey]||TIERS.small,d=document.createElement('div');d.className='card monster';d.innerHTML=`<div class="micon">${t.icon}</div><b>${escapeHtml(m.name)}</b><small>討伐 ×${m.count}</small>`;area.appendChild(d)})}
function renderAchievements(){const area=document.getElementById('achievementList');area.innerHTML='';ACH.forEach(a=>{const unlocked=state.achievements.includes(a.id),d=document.createElement('div');d.className='review-row';d.style.opacity=unlocked?'1':'.4';d.innerHTML=`<div><b>${unlocked?'🏅 '+escapeHtml(a.title):'🔒 ???'}</b><small>${unlocked?escapeHtml(a.desc):'条件はまだ伏せられている'}</small></div><span>${unlocked?'解放':'未解放'}</span>`;area.appendChild(d)})}
function renderRecords(){const tm=totalMinutes();document.getElementById('totalStudy').textContent=tm<60?tm+'分':`${Math.floor(tm/60)}時間${tm%60}分`;const chart=document.getElementById('studyChart');chart.innerHTML='';const keys=weekKeys(),max=Math.max(1,...keys.map(k=>state.studyByDate[k]||0));keys.forEach((k,i)=>{const col=document.createElement('div');col.className='chart-col';const h=Math.max(3,Math.round((state.studyByDate[k]||0)/max*100));col.innerHTML=`<div class="chart-bar" style="height:${h}%" title="${state.studyByDate[k]||0}分"></div><span>${['月','火','水','木','金','土','日'][i]}<br>${state.studyByDate[k]||0}</span>`;chart.appendChild(col)});const log=document.getElementById('logList');log.innerHTML='';[...state.log].reverse().slice(0,50).forEach(l=>{const d=document.createElement('div');d.className='log-row';d.innerHTML=`<span>${escapeHtml(l.name)}</span><span>${l.xp?`+${l.xp}XP `:''}${l.minutes?`${l.minutes}分`:''}</span>`;log.appendChild(d)});if(!state.log.length)log.innerHTML='<div class="muted" style="font-size:11px">まだ記録がありません。</div>'}
async function finishResult(res){let msg=`達成！ +${res.gain} XP`;if(res.defeated){const drops=defeatBoss(res.defeated);msg=`討伐成功！ 素材：${drops}`}checkAchievements();render();await save();toast(msg)}
function openModal(id){document.getElementById(id).classList.add('show')}function closeModal(el){el.closest('.modal')?.classList.remove('show')}
// navigation
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(!b)return;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('hidden',v.dataset.view!==b.dataset.view));document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));window.scrollTo({top:0,behavior:'smooth'})});
// daily
document.getElementById('dailyGrid').addEventListener('click',async e=>{const b=e.target.closest('[data-daily]');if(!b)return;const it=state.daily.items.find(x=>x.id===b.dataset.daily);if(!it||it.done)return;it.done=true;const res=completeLearning(it.name,it.xp,it.minutes,'normal');await finishResult(res)});
// add quest
document.getElementById('addQuest').addEventListener('click',async()=>{const name=document.getElementById('questName').value.trim(),minutes=Math.round(Number(document.getElementById('questMinutes').value)),diff=document.getElementById('questDiff').value;if(!name)return toast('クエスト内容を入力してください');if(!Number.isFinite(minutes)||minutes<1||minutes>600)return toast('勉強時間は1〜600分');state.quests.push({id:'q'+Date.now(),name,minutes,diffKey:diff,xp:DIFF[diff].xp});document.getElementById('questName').value='';render();await save();toast('クエストを受注しました')});
// add boss
document.getElementById('addBoss').addEventListener('click',async()=>{const name=document.getElementById('bossName').value.trim(),hp=Math.round(Number(document.getElementById('bossHp').value)),tier=document.getElementById('bossTier').value,hours=Number(document.getElementById('bossDeadline').value);if(!name)return toast('討伐対象名を入力してください');if(!Number.isFinite(hp)||hp<50||hp>99999)return toast('HPは50〜99999');const boss={id:'b'+Date.now(),name,maxHp:hp,hp,tierKey:tier,reward:Math.round(hp*.2),deadlineAt:Number.isFinite(hours)&&hours>0?Date.now()+hours*3600000:null,reviewStage:-1};state.bosses.push(boss);if(!state.activeBossId)state.activeBossId=boss.id;document.getElementById('bossName').value='';render();await save();toast('討伐依頼を張り出しました')});
// boss actions
document.getElementById('bossArea').addEventListener('click',async e=>{const target=e.target.closest('[data-target]');if(target){state.activeBossId=target.dataset.target;render();await save();return}const edit=e.target.closest('[data-edit-boss]');if(edit){const b=state.bosses.find(x=>x.id===edit.dataset.editBoss);if(!b)return;document.getElementById('editBossId').value=b.id;document.getElementById('editBossName').value=b.name;document.getElementById('editBossHp').value=b.maxHp;document.getElementById('editBossTier').value=b.tierKey;openModal('editBossModal');return}const rem=e.target.closest('[data-remove-boss]');if(rem){state.bosses=state.bosses.filter(x=>x.id!==rem.dataset.removeBoss);if(state.activeBossId===rem.dataset.removeBoss)state.activeBossId=state.bosses[0]?.id||null;render();await save();toast('討伐依頼を破棄しました')}});
// quest actions
document.getElementById('questList').addEventListener('click',async e=>{const clear=e.target.closest('[data-clear]');if(clear){const i=state.quests.findIndex(x=>x.id===clear.dataset.clear);if(i<0)return;const q=state.quests.splice(i,1)[0];const res=completeLearning(q.name,q.xp,q.minutes,q.diffKey);await finishResult(res);return}const edit=e.target.closest('[data-edit-quest]');if(edit){const q=state.quests.find(x=>x.id===edit.dataset.editQuest);if(!q)return;document.getElementById('editQuestId').value=q.id;document.getElementById('editQuestName').value=q.name;document.getElementById('editQuestMinutes').value=q.minutes;document.getElementById('editQuestDiff').value=q.diffKey;openModal('editQuestModal')}});
// edit quest
document.getElementById('saveQuestEdit').addEventListener('click',async()=>{const q=state.quests.find(x=>x.id===document.getElementById('editQuestId').value);if(!q)return;const name=document.getElementById('editQuestName').value.trim(),mins=Math.round(Number(document.getElementById('editQuestMinutes').value)),diff=document.getElementById('editQuestDiff').value;if(!name||!Number.isFinite(mins)||mins<1||mins>600)return toast('入力内容を確認してください');q.name=name;q.minutes=mins;q.diffKey=diff;q.xp=DIFF[diff].xp;document.getElementById('editQuestModal').classList.remove('show');render();await save();toast('クエストを更新しました')});document.getElementById('deleteQuest').addEventListener('click',async()=>{const id=document.getElementById('editQuestId').value;state.quests=state.quests.filter(x=>x.id!==id);document.getElementById('editQuestModal').classList.remove('show');render();await save();toast('クエストを削除しました')});
// edit boss
document.getElementById('saveBossEdit').addEventListener('click',async()=>{const b=state.bosses.find(x=>x.id===document.getElementById('editBossId').value);if(!b)return;const name=document.getElementById('editBossName').value.trim(),hp=Math.round(Number(document.getElementById('editBossHp').value)),tier=document.getElementById('editBossTier').value;if(!name||!Number.isFinite(hp)||hp<50||hp>99999)return toast('名前とHPを確認してください');const damage=Math.max(0,b.maxHp-b.hp);b.name=name;b.maxHp=hp;b.hp=Math.max(1,hp-damage);b.tierKey=tier;b.reward=Math.round(hp*.2);document.getElementById('editBossModal').classList.remove('show');render();await save();toast('討伐対象を更新しました')});document.getElementById('deleteBoss').addEventListener('click',async()=>{const id=document.getElementById('editBossId').value;state.bosses=state.bosses.filter(x=>x.id!==id);if(state.activeBossId===id)state.activeBossId=state.bosses[0]?.id||null;document.getElementById('editBossModal').classList.remove('show');render();await save();toast('討伐対象を削除しました')});
// gear
document.getElementById('gearTabs').addEventListener('click',e=>{const b=e.target.closest('[data-gear-tab]');if(!b)return;gearSlot=b.dataset.gearTab;selectedGear=null;renderGear()});document.getElementById('gearGrid').addEventListener('click',e=>{const b=e.target.closest('[data-gear]');if(!b)return;selectedGear=b.dataset.gear;renderGearGrid();renderGearDetail()});document.getElementById('gearDetail').addEventListener('click',async e=>{const g=gearById(selectedGear);if(!g)return;if(e.target.id==='craftGear'){if(craft(g)){render();await save();toast(g.name+' を作成しました')}}if(e.target.id==='equipGear'&&state.craftedGear.includes(g.id)){state.equipped[g.slot]=state.equipped[g.slot]===g.id?null:g.id;render();await save();toast(state.equipped[g.slot]===g.id?g.name+' を装備しました':'装備を外しました')}});
// manual study
document.getElementById('addStudy').addEventListener('click',async()=>{const name=document.getElementById('manualStudyName').value.trim()||'自主学習',mins=Math.round(Number(document.getElementById('manualStudyMinutes').value));if(!Number.isFinite(mins)||mins<1||mins>600)return toast('時間は1〜600分');touchStudyDay(mins,name);checkAchievements();render();await save();document.getElementById('manualStudyName').value='';toast(`${mins}分を記録しました`)});
// modal close
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeModal(b)));document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show')}));
load();setInterval(async()=>{const before=JSON.stringify([state.bosses.length,state.reviewQueue.length]);checkReviews();checkDeadlines();const after=JSON.stringify([state.bosses.length,state.reviewQueue.length]);if(before!==after){render();await save()}},60000);
})();
</script>
</body></html>
