<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ハンターズギルド Study RPG v6.1</title>
<style>
body{margin:0;background:#100d0b;color:#eee1c8;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;display:grid;place-items:center;min-height:100vh}
#loading{padding:24px;text-align:center;font-weight:800}
</style>
</head>
<body>
<div id="loading">ハンターズギルド v6.1 を読み込み中…</div>
<script>
(async()=>{
  try{
    const urls=Array.from({length:9},(_,i)=>`chunks/part${String(i).padStart(2,'0')}.txt?v=61`);
    const parts=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(u);return r.text()})));
    let html=parts.join('');
    // iPhone/iPadでSVGプレビュー処理が失敗しても装備一覧を先に表示する。
    html=html.replace(
      'applyVisuals();renderGearTabs();renderGearGrid();renderGearDetail();',
      "renderGearTabs();renderGearGrid();renderGearDetail();try{applyVisuals()}catch(e){console.warn('gear preview skipped',e)};"
    );
    html=html.replace(
      "const op=(id,on)=>document.getElementById(id).style.opacity=on?'1':'.14';",
      "const op=(id,on)=>{const el=document.getElementById(id);if(el)el.style.opacity=on?'1':'.14'};"
    );
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loading').textContent='読み込みに失敗しました。ページを再読み込みしてください。';
    console.error(e);
  }
})();
</script>
</body>
</html>
