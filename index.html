<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ハンターズギルド Study RPG v5</title>
<style>
:root{--bg:#100d0b;--panel:#1c1713;--panel2:#251d17;--iron:#443a31;--iron2:#665646;--bone:#eee1c8;--muted:#a99b86;--gold:#d2a842;--ember:#c6532d;--ember2:#ef7842;--blood:#92201e;--green:#486648;--blue:#526d7f;--purple:#675073;--shadow:rgba(0,0,0,.55)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--bone);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:radial-gradient(circle at 50% -10%,#34261b 0,#17120f 38%,#0c0a08 100%);min-height:100vh;padding:16px 12px 92px}.app{max-width:520px;margin:0 auto}.hidden{display:none!important}button,input,select{font:inherit}.brand{text-align:center;padding:4px 0 12px}.brand h1{font-size:22px;margin:0;color:var(--ember2);letter-spacing:.04em}.brand p{font-size:11px;color:var(--muted);margin:4px 0 0}.ornament{height:6px;margin:0 auto 14px;max-width:180px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--iron);border-radius:8px;box-shadow:0 10px 24px var(--shadow),inset 0 0 0 1px rgba(255,255,255,.025)}.section{margin:18px 0}.section-title{display:flex;align-items:center;gap:8px;margin:0 2px 9px;font-weight:900;font-size:13px;letter-spacing:.05em}.section-title:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--iron2),transparent)}.muted{color:var(--muted)}.gold{color:var(--gold)}
.status{padding:15px}.status-top{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center}.rank-badge{width:58px;height:58px;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold),#8d6020);color:#1a1209;font-weight:1000;clip-path:polygon(50% 0,95% 25%,95% 75%,50% 100%,5% 75%,5% 25%)}.rank-name{font-weight:900;color:var(--ember2);font-size:15px}.rank-sub{font-size:11px;color:var(--muted);margin-top:3px}.stat-side{text-align:right;font-size:10px;color:var(--muted)}.stat-side b{font-size:20px;color:var(--bone);display:block}.bar{height:13px;border:1px solid var(--iron2);background:#0b0908;margin-top:12px;overflow:hidden;border-radius:2px}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),#7da76d);transition:width .35s}.bar-line{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:5px}.quick-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.quick-stat{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06);padding:8px;text-align:center;border-radius:4px}.quick-stat b{display:block;font-size:15px;color:var(--gold)}.quick-stat span{font-size:9px;color:var(--muted)}.hunter-hp{margin-top:10px}.hunter-hp .hp-caption{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:5px}.hunter-hp .hp-track{height:13px;background:#0b0908;border:1px solid #704038;border-radius:2px;overflow:hidden}.hunter-hp .hp-fill{height:100%;background:linear-gradient(90deg,#9b2d2d,#e05b43);transition:width .3s}.rest-row{display:flex;justify-content:flex-end;margin-top:8px}.elem-badge{display:inline-block;padding:2px 7px;border-radius:999px;border:1px solid var(--iron2);font-size:9px;font-weight:900;margin-right:4px;background:rgba(255,255,255,.035)}.elem-fire{color:#ff8b55;border-color:#7d3b28}.elem-water{color:#7ab6e9;border-color:#355d79}.elem-thunder{color:#f0d65a;border-color:#786822}.elem-ice{color:#b7e8ff;border-color:#4f7887}.elem-dragon{color:#d99cff;border-color:#6f467e}.elem-none{color:#c8bda9}.combat-note{margin-top:8px;padding:8px 10px;border:1px solid rgba(210,168,66,.25);background:rgba(210,168,66,.05);font-size:10px;color:var(--muted);border-radius:4px}.damage-preview{font-weight:900;color:var(--gold)}
/* remaining styles and app code preserved from v5 */
</style>
</head>
<body>
<div id="appMount"></div>
<script>
/* v5 app content */
</script>
</body>
</html>
