<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ハンターズギルド Study RPG v6.4</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#100d0b;overflow:hidden}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:#eee1c8;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-weight:800;padding:24px;text-align:center}
#appframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#100d0b;display:none}
</style>
</head>
<body>
<div id="loading">ハンターズギルド v6.4 を読み込み中…</div>
<iframe id="appframe" title="ハンターズギルド Study RPG v6.4"></iframe>
<script>
(async()=>{
  const loading=document.getElementById('loading');
  const frame=document.getElementById('appframe');
  try{
    const urls=Array.from({length:9},(_,i)=>`chunks/part${String(i).padStart(2,'0')}.txt?app64=1`);
    const parts=await Promise.all(urls.map(async u=>{
      const r=await fetch(u,{cache:'no-store'});
      if(!r.ok) throw new Error('読み込み失敗: '+u);
      return await r.text();
    }));
    const html=parts.join('');
    if(!html.includes('<script')) throw new Error('アプリ本体が見つかりません');
    frame.onload=()=>{loading.style.display='none';frame.style.display='block'};
    frame.srcdoc=html;
  }catch(e){
    loading.innerHTML='<div><h2>起動エラー</h2><p>アプリの読み込みに失敗しました。</p><pre style="white-space:pre-wrap;text-align:left;font-size:11px">'+String(e&&e.stack||e).replace(/[&<>]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]))+'</pre></div>';
  }
})();
</script>
</body>
</html>
